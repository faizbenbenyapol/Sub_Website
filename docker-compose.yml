# ฐานข้อมูลสำหรับพัฒนา — รันด้วย `docker compose up -d`
# ใช้พอร์ต 3307 เพราะ XAMPP (MariaDB) มักจองพอร์ต 3306 ไว้แล้ว
services:
  db:
    image: mysql:8.4
    container_name: tadyang-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tadyang
      MYSQL_USER: tadyang
      MYSQL_PASSWORD: tadyang
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # หน้าเว็บดูข้อมูลใน DB ตอนพัฒนา/demo → http://localhost:8080 (user: tadyang / tadyang)
  phpmyadmin:
    image: phpmyadmin:5
    container_name: tadyang-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
